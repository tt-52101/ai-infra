services:
  # LMCache Standalone：内部 KV Cache 共享层，不对宿主机暴露端口
  lmcache-server:
    image: ${LMCACHE_IMAGE:-lmcache/standalone:nightly}
    container_name: lmcache-server
    network_mode: host
    environment:
      - LMCACHE_LOG_LEVEL=${LMCACHE_LOG_LEVEL:-INFO}
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - /opt/venv/bin/lmcache
      - server
      - --port
      - "${LMCACHE_MP_PORT:-6555}"
      - --http-host
      - 127.0.0.1
      - --http-port
      - "${LMCACHE_HTTP_PORT:-8080}"
      - --l1-size-gb
      - "${LMCACHE_L1_SIZE_GB:-60}"
      - --eviction-policy
      - "${LMCACHE_EVICTION_POLICY:-LRU}"
      - --max-workers
      - "${LMCACHE_MAX_WORKERS:-4}"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${LMCACHE_HTTP_PORT:-8080}/healthcheck', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
