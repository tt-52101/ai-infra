services:
  # OpenAI 兼容统一入口：唯一对宿主机暴露的服务
  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    image: deepseek-pd-gateway:local
    container_name: deepseek-pd-gateway
    network_mode: host
    environment:
      - PREFILL_NODE_URL=http://127.0.0.1:8001/v1/chat/completions
      - DECODE_NODE_URL=http://127.0.0.1:8002/v1/chat/completions
      - UPSTREAM_API_KEY=${VLLM_API_KEY:-sk-mvp-change-me}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-sk-mvp-change-me}
      - PREFILL_TIMEOUT_SECONDS=${PREFILL_TIMEOUT_SECONDS:-300}
      - DECODE_TIMEOUT_SECONDS=${DECODE_TIMEOUT_SECONDS:-300}
      - PREFILL_MAX_TOKENS=${PREFILL_MAX_TOKENS:-1}
    depends_on:
      vllm-prefill:
        condition: service_healthy
      vllm-decode:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
