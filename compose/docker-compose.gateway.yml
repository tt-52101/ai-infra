version: '3.8'

services:
  # OpenAI 兼容统一入口：唯一对宿主机暴露的服务
  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: deepseek-pd-gateway:local
    container_name: deepseek-pd-gateway
    ports:
      - "8000:8000"
    environment:
      - PREFILL_NODE_URL=http://vllm-prefill:8001/v1/chat/completions
      - DECODE_NODE_URL=http://vllm-decode:8002/v1/chat/completions
      - UPSTREAM_API_KEY=${VLLM_API_KEY:-sk-mvp-change-me}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-sk-mvp-change-me}
      - PREFILL_TIMEOUT_SECONDS=${PREFILL_TIMEOUT_SECONDS:-300}
      - DECODE_TIMEOUT_SECONDS=${DECODE_TIMEOUT_SECONDS:-300}
      - PREFILL_MAX_TOKENS=${PREFILL_MAX_TOKENS:-1}
    depends_on:
      vllm-prefill:
        condition: service_healthy
      vllm-decode:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ds-pd-network
